version: '3.9'
# Local dev override — only spins up PostgreSQL
# Apps run with npm run dev locally

services:
  postgres:
    image: postgres:16-alpine
    container_name: swingtrader-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: swingtrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
