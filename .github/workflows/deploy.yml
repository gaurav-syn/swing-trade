name: CI/CD — SwingTrader Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # BUILD BACKEND
  # ─────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install --legacy-peer-deps
        working-directory: apps/backend-nestjs

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend-nestjs

      - name: Build
        run: npm run build
        working-directory: apps/backend-nestjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            apps/backend-nestjs/dist
            apps/backend-nestjs/prisma
            apps/backend-nestjs/package.json
            apps/backend-nestjs/package-lock.json
          retention-days: 1

  # ─────────────────────────────────────────────
  # DEPLOY BACKEND → AZURE APP SERVICE
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend-nestjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production deps
        run: npm install --only=production --legacy-peer-deps
        working-directory: apps/backend-nestjs

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package: apps/backend-nestjs

  # Frontend is deployed via azure-static-web-apps-black-grass-0f6ebb100.yml

