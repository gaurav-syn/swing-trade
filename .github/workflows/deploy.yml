name: CI/CD — SwingTrader Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # LINT & TYPE CHECK
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm ci
        working-directory: apps/backend-nestjs

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/frontend-nextjs

      - name: Type check backend
        run: npx tsc --noEmit
        working-directory: apps/backend-nestjs

      - name: Type check frontend
        run: npm run type-check
        working-directory: apps/frontend-nextjs

  # ─────────────────────────────────────────────
  # BUILD BACKEND
  # ─────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend-nestjs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/backend-nestjs

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend-nestjs

      - name: Build
        run: npm run build
        working-directory: apps/backend-nestjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            apps/backend-nestjs/dist
            apps/backend-nestjs/prisma
            apps/backend-nestjs/package.json
            apps/backend-nestjs/package-lock.json
          retention-days: 1

  # ─────────────────────────────────────────────
  # BUILD FRONTEND
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend-nextjs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/frontend-nextjs

      - name: Build
        run: npm run build
        working-directory: apps/frontend-nextjs
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}/api/v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend-nextjs/.next
          retention-days: 1

  # ─────────────────────────────────────────────
  # DEPLOY BACKEND → AZURE APP SERVICE
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend-nestjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production deps
        run: npm ci --only=production
        working-directory: apps/backend-nestjs

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run DB migrations
        run: |
          cd apps/backend-nestjs
          DATABASE_URL="${{ secrets.DATABASE_URL }}" npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package: apps/backend-nestjs

  # ─────────────────────────────────────────────
  # DEPLOY FRONTEND → AZURE STATIC WEB APPS
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/frontend-nextjs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/frontend-nextjs

      - name: Build
        run: npm run build
        working-directory: apps/frontend-nextjs
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}/api/v1

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/frontend-nextjs'
          output_location: '.next'
          skip_app_build: false
