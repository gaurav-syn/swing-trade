version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: swingtrader-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swingtrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swingtrader_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swingtrader-net

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend-nestjs
      dockerfile: Dockerfile
    container_name: swingtrader-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-swingtrader_dev}@postgres:5432/swingtrader?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-in-production-32-chars-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-secret-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swingtrader-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend-nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: swingtrader-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - swingtrader-net

volumes:
  postgres_data:
    driver: local

networks:
  swingtrader-net:
    driver: bridge
